name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v

  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Fetch luau-lsp 1.70.1
        run: |
          curl -sSL -o luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -q luau-lsp.zip
          chmod +x luau-lsp
      - name: Fetch Luau 0.745
        run: |
          mkdir -p luau-bin
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          unzip -q luau.zip -d luau-bin
          chmod +x luau-bin/luau
      - run: ./luau-lsp analyze --definitions=types/tern.d.luau window.luau
      - run: python -m unittest tests.test_luau_harness -v
        env:
          LUAU: ${{ github.workspace }}/luau-bin/luau
          TERN_SIDEPULSE_REQUIRE_LUAU: "1"

  sidepulse-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out SidePulse at the verified revision (the inteliwear/sidepulse#72 merge)
        uses: actions/checkout@v4
        with:
          repository: inteliwear/sidepulse
          ref: ad4a5217fd3a833cfa2a12e1eaf055f22948cd53
          path: sidepulse
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest tests.test_sidepulse_contract -v
        env:
          SIDEPULSE_SRC: ${{ github.workspace }}/sidepulse/src
          TERN_SIDEPULSE_REQUIRE_CONTRACT: "1"
